<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Canvas</title>
  <script src="fabric.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f6;
      overflow: hidden;
    }

    /* ── ツールバー ─────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #ffffff;
      border-bottom: 1px solid #d9d9d9;
      height: 44px;
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #ffffff;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn:hover { background: #f5f5f5; }
    .btn.active {
      background: #1677ff;
      border-color: #1677ff;
      color: #ffffff;
    }
    .btn.danger { border-color: #ff4d4f; color: #ff4d4f; }
    .btn.danger:hover { background: #fff1f0; }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn:disabled:hover { background: #ffffff; }
    .btn.danger:disabled:hover { background: #ffffff; }

    #category-select {
      padding: 4px 8px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #ffffff;
      font-size: 13px;
      max-width: 140px;
    }

    #mode-label {
      font-size: 12px;
      color: #666;
      margin-left: 4px;
    }
    #line-count {
      margin-left: auto;
      font-size: 12px;
      color: #888;
    }
    #zoom-label {
      font-size: 12px;
      color: #555;
      min-width: 52px;
      text-align: right;
    }

    /* ── キャンバスラッパー ──────────────────────────── */
    #canvas-wrapper {
      position: relative;
      overflow: hidden;
      background: #e8e8e8;
      cursor: crosshair;
    }
    #canvas-wrapper.mode-move          { cursor: grab; }
    #canvas-wrapper.mode-move.dragging { cursor: grabbing; }
    #canvas-wrapper.mode-select        { cursor: default; }
    canvas { display: block; }
  </style>
</head>
<body>

<!-- ツールバー -->
<div id="toolbar">
  <button class="btn active" id="btn-line" title="線を引くモード">✏️ 線モード</button>
  <button class="btn"        id="btn-move" title="図面をパンするモード">✋ 移動モード</button>
  <button class="btn"        id="btn-select" title="線を選択するモード">👆 選択モード</button>
  <select id="category-select" title="描画するカテゴリ（積算属性）を選択"></select>
  <span id="mode-label">クリック＆ドラッグで直線を描画</span>
  <button class="btn danger" id="btn-delete-selected" title="選択中の線を削除" disabled>🗑 選択中を削除</button>
  <button class="btn"        id="btn-undo" title="直近の操作を取り消す" disabled>↩️ 元に戻す</button>
  <button class="btn danger" id="btn-clear" title="すべての線を削除">🗑 全消去</button>
  <button class="btn"        id="btn-reset" title="初期表示に戻す">⟳ リセット</button>
  <span id="zoom-label">100%</span>
  <span id="line-count">線: 0 本</span>
</div>

<!-- Fabric.js キャンバス -->
<div id="canvas-wrapper">
  <canvas id="c"></canvas>
</div>

<script>
(function () {
  "use strict";

  const TOOLBAR_H = 44;  // CSS で定義したツールバー高さ (px)

  // ─── Streamlit 双方向通信 ──────────────────────────────────
  const Streamlit = {
    onRender(cb) {
      // streamlit:render を受信したら renderReceived フラグを立てて再試行を停止する
      let renderReceived = false;
      window.addEventListener("message", (ev) => {
        if (
          ev.source === window.parent &&
          ev.data &&
          ev.data.type === "streamlit:render"
        ) {
          renderReceived = true;
          cb(ev.data.args || {});
        }
      });
      // componentReady を送信する（Streamlit の React が初期化済みでない場合に備え
      // 500ms ごとに最大 60s 再試行する。これは Streamlit component-lib の推奨動作）
      function sendReady() {
        window.parent.postMessage(
          { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
          "*"
        );
      }
      sendReady();
      const retryId = setInterval(function () {
        if (renderReceived) { clearInterval(retryId); return; }
        sendReady();
      }, 500);
      setTimeout(function () { clearInterval(retryId); }, 60000);
    },
    setValue(value) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: value },
        "*"
      );
    },
    setFrameHeight(height) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: height },
        "*"
      );
    },
  };

  // ─── カテゴリ → 表示色（A3-1） ─────────────────────────────
  // 重要: color はデータではなく、category からフロント側が導出する表示専用の値。
  // 保存データ（objects配列 / canvas_states）には category のみを含め、色は含めない。
  const CATEGORY_COLORS = {
    "外壁":             "#e63946",
    "軒天":             "#f77f00",
    "破風":             "#fcbf49",
    "鼻隠し":           "#06a77d",
    "雨樋":             "#1d3557",
    "シャッターボックス": "#457b9d",
    "水切り":           "#2ec4b6",
    "幕板":             "#9d4edd",
    "ベランダ床":        "#ff6392",
    "シーリング":        "#6a994e",
    "その他":           "#6c757d",
  };
  // 未分類（category が null、または未知の値）の既定色
  const DEFAULT_LINE_COLOR = "#999999";

  function colorForCategory(category) {
    if (typeof category === "string" && Object.prototype.hasOwnProperty.call(CATEGORY_COLORS, category)) {
      return CATEGORY_COLORS[category];
    }
    return DEFAULT_LINE_COLOR;
  }

  // ─── 状態変数 ────────────────────────────────────────────
  let canvas            = null;   // Fabric.Canvas
  let bgImage           = null;   // Fabric.Image（背景）
  let imageWidth        = 0;      // 元画像 px 幅
  let imageHeight       = 0;      // 元画像 px 高さ
  let fitZoom           = 0;      // 初期フィット倍率（背景ロード前は 0、ロード後に更新）
  let canvasDisplayHeight = 600;  // キャンバス表示高さ（ツールバー含まず）
  let currentPageKey    = "";     // 現在のページキー
  let mode              = "line"; // "line" | "move" | "select"

  // カテゴリ（積算属性）関連
  let categories       = [];      // Python から渡される候補リスト（唯一の正本は core.estimate_storage）
  let currentCategory  = null;    // 次に描画する線へ適用するカテゴリ

  // 直近1操作Undo（追加・削除のみ、Redoなし）
  // undoSnapshot: 直前の変更操作の「変更前」状態（serializeLines() と同じ形式の配列）。
  // 1回 Undo を実行すると null に戻すため、連続 Undo・Redo はできない。
  let undoSnapshot = null;

  // 線描画中の状態
  let isDrawing         = false;
  let drawStartX        = 0;
  let drawStartY        = 0;
  let activePreviewLine = null;

  // パン中の状態
  let isPanning  = false;
  let panLastX   = 0;
  let panLastY   = 0;

  // ズームデバウンスタイマー
  let zoomDebounceTimer = null;
  const ZOOM_DEBOUNCE_MS = 300;

  // 前回レンダリング情報（同一ページ検知用）
  let lastPageKey      = null;
  let lastImageDataUrl = null;

  // 非同期画像読込の競合防止キー
  let activeLoadKey = null;

  // DOM 要素
  const btnLine           = document.getElementById("btn-line");
  const btnMove           = document.getElementById("btn-move");
  const btnSelect         = document.getElementById("btn-select");
  const categorySelect    = document.getElementById("category-select");
  const btnDeleteSelected = document.getElementById("btn-delete-selected");
  const btnUndo           = document.getElementById("btn-undo");
  const btnClear          = document.getElementById("btn-clear");
  const btnReset          = document.getElementById("btn-reset");
  const modeLabel         = document.getElementById("mode-label");
  const lineCount         = document.getElementById("line-count");
  const zoomLabel         = document.getElementById("zoom-label");
  const wrapper           = document.getElementById("canvas-wrapper");

  // ─── レイアウト適用 ──────────────────────────────────────
  function applyLayout() {
    const cw = document.body.clientWidth || 800;
    const ch = canvasDisplayHeight;
    if (canvas) {
      canvas.setWidth(cw);
      canvas.setHeight(ch);
    }
    wrapper.style.width  = cw + "px";
    wrapper.style.height = ch + "px";
    return { cw, ch };
  }

  // ─── Fabric.js 初期化 ─────────────────────────────────────
  function initCanvas() {
    const { cw, ch } = applyLayout();
    canvas = new fabric.Canvas("c", {
      width: cw,
      height: ch,
      selection: false,
      renderOnAddRemove: true,
    });
    canvas.on("mouse:down",  onMouseDown);
    canvas.on("mouse:move",  onMouseMove);
    canvas.on("mouse:up",    onMouseUp);
    canvas.on("mouse:wheel", onMouseWheel);
    canvas.on("selection:created", onSelectionChanged);
    canvas.on("selection:updated", onSelectionChanged);
    canvas.on("selection:cleared", updateDeleteButtonState);
  }

  // ─── ビューポート値の検証 ────────────────────────────────
  function isValidViewport(vt) {
    if (!Array.isArray(vt) || vt.length !== 6) return false;
    for (const v of vt) {
      if (typeof v !== "number" || !isFinite(v) || isNaN(v)) return false;
    }
    // ズーム成分（a=vt[0], d=vt[3]）は正値でなければならない
    if (vt[0] <= 0 || vt[3] <= 0) return false;
    return true;
  }

  // ─── 背景画像読み込み（fromURL 完了後に状態を復元） ──────
  function loadBackground(dataUrl, imgW, imgH, stateToRestore) {
    imageWidth  = imgW;
    imageHeight = imgH;

    // この読み込みを識別するキーを記録（競合防止）
    const myLoadKey = currentPageKey;
    activeLoadKey   = myLoadKey;

    fabric.Image.fromURL(dataUrl, function (img) {
      // 別ページの読み込みが開始されていれば破棄（古い結果を無視）
      if (activeLoadKey !== myLoadKey) return;

      img.set({
        left: 0,
        top: 0,
        selectable: false,
        evented: false,
        originX: "left",
        originY: "top",
      });

      bgImage = img;
      canvas.add(img);
      img.sendToBack();

      // ビューポート復元 or 初期フィット
      const { cw, ch } = applyLayout();
      const savedVt = stateToRestore && stateToRestore.viewport_transform;

      // fitZoom は常に再計算（初期フィット倍率を正確に保持するため）
      fitZoom = Math.min(cw / imgW, ch / imgH);

      if (isValidViewport(savedVt)) {
        // 保存済みのビューポートを復元
        canvas.setViewportTransform(savedVt.slice());
      } else {
        // 初期フィット: 縦横両方が収まる倍率で中央寄せ
        const offsetX = (cw - imgW * fitZoom) / 2;
        const offsetY = (ch - imgH * fitZoom) / 2;
        canvas.setViewportTransform([fitZoom, 0, 0, fitZoom, offsetX, offsetY]);
      }

      canvas.requestRenderAll();
      updateZoomLabel();

      // 直線を復元
      const linesToRestore = stateToRestore ? (stateToRestore.objects || []) : [];
      restoreLines(linesToRestore);
    }, { crossOrigin: "Anonymous" });
  }

  // ─── 初期フィット表示へリセット ──────────────────────────
  function resetView() {
    if (!canvas) return;
    const { cw, ch } = applyLayout();
    fitZoom = Math.min(cw / imageWidth, ch / imageHeight);
    const offsetX = (cw - imageWidth  * fitZoom) / 2;
    const offsetY = (ch - imageHeight * fitZoom) / 2;
    canvas.setViewportTransform([fitZoom, 0, 0, fitZoom, offsetX, offsetY]);
    canvas.requestRenderAll();
    updateZoomLabel();
  }

  // ─── カテゴリ候補の反映（A3-1） ───────────────────────────
  // categories の唯一の正本は core.estimate_storage.CANVAS_CATEGORIES。
  // フロント側では二重管理せず、Streamlit から渡された候補をそのまま表示するのみ。
  function populateCategories(cats) {
    if (!Array.isArray(cats) || cats.length === 0) return;
    categories = cats.slice();

    categorySelect.innerHTML = "";
    categories.forEach((cat) => {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      categorySelect.appendChild(opt);
    });

    if (!categories.includes(currentCategory)) {
      currentCategory = categories[0];
    }
    categorySelect.value = currentCategory;
  }

  categorySelect.addEventListener("change", () => {
    currentCategory = categorySelect.value;
  });

  // ─── 選択モード: 個別選択の許可/禁止を一括切替 ─────────────
  // 誤操作防止のため、選択モード以外では既存線の selectable/evented を false に戻す。
  // 選択できても移動・回転・拡大縮小はできないよう常に lockMovement 系は true に固定する。
  function setLineInteractivity(enable) {
    getCompletedLines().forEach((ln) => {
      ln.set({
        selectable: enable,
        evented:    enable,
      });
    });
  }

  // ─── モード切替 ──────────────────────────────────────────
  function setMode(m) {
    mode = m;
    btnLine.classList.remove("active");
    btnMove.classList.remove("active");
    btnSelect.classList.remove("active");
    wrapper.classList.remove("mode-move", "mode-select");

    if (canvas) {
      if (mode !== "select") {
        canvas.discardActiveObject();
      }
      setLineInteractivity(mode === "select");
      canvas.requestRenderAll();
    }
    updateDeleteButtonState();

    if (m === "line") {
      btnLine.classList.add("active");
      modeLabel.textContent = "クリック＆ドラッグで直線を描画";
    } else if (m === "move") {
      btnMove.classList.add("active");
      modeLabel.textContent = "ドラッグで図面をパン";
      wrapper.classList.add("mode-move");
    } else {
      btnSelect.classList.add("active");
      modeLabel.textContent = "線をクリックして選択・削除";
      wrapper.classList.add("mode-select");
    }
  }

  btnLine.addEventListener("click", () => setMode("line"));
  btnMove.addEventListener("click", () => setMode("move"));
  btnSelect.addEventListener("click", () => setMode("select"));

  // ─── 選択状態変化 ─────────────────────────────────────────
  function onSelectionChanged() {
    const active = canvas.getActiveObject();
    // 複数選択・一括削除は今回スコープ外のため、activeSelection（複数選択）が
    // 発生した場合は選択解除し、単一選択のみを許可する。
    if (active && active.type === "activeSelection") {
      canvas.discardActiveObject();
      canvas.requestRenderAll();
    }
    updateDeleteButtonState();
  }

  function updateDeleteButtonState() {
    const active = canvas ? canvas.getActiveObject() : null;
    btnDeleteSelected.disabled = !(mode === "select" && active);
  }

  // ─── Undo（直近1操作のみ、Redoなし） ────────────────────────
  function captureUndoSnapshot() {
    undoSnapshot = serializeLines();
    updateUndoButtonState();
  }

  function updateUndoButtonState() {
    btnUndo.disabled = (undoSnapshot === null);
  }

  function performUndo() {
    if (undoSnapshot === null) return;
    const snapshot = undoSnapshot;
    undoSnapshot = null;

    getCompletedLines().forEach((ln) => canvas.remove(ln));
    restoreLines(snapshot);
    canvas.requestRenderAll();

    updateUndoButtonState();
    updateDeleteButtonState();
    sendToStreamlit();
  }

  btnUndo.addEventListener("click", performUndo);

  // ─── UI 更新 ─────────────────────────────────────────────
  function updateZoomLabel() {
    if (!canvas) return;
    const pct = Math.round(canvas.viewportTransform[0] * 100);
    zoomLabel.textContent = pct + "%";
  }

  function getCompletedLines() {
    return canvas.getObjects().filter(
      (o) => o.type === "line" && o._completed === true
    );
  }

  function updateLineCount() {
    const n = getCompletedLines().length;
    lineCount.textContent = "線: " + n + " 本";
  }

  // ─── 状態シリアライズ ────────────────────────────────────
  // JS → Python で返す形式:
  // {
  //   page_key: str,
  //   viewport_transform: [a,b,c,d,e,f],  // 6要素
  //   objects: [{"type":"line","orig_x1":...,"category":str|null,...}]
  // }
  // 注意: color は含めない（category から表示のたびに導出する派生値のため）。
  function serializeLines() {
    return getCompletedLines().map((ln) => ({
      type:      "line",
      orig_x1:   ln._origX1,
      orig_y1:   ln._origY1,
      orig_x2:   ln._origX2,
      orig_y2:   ln._origY2,
      length_px: ln._lengthPx,
      category:  (ln._category != null) ? ln._category : null,
    }));
  }

  function serializeState() {
    const vt = canvas.viewportTransform;
    return {
      page_key:           currentPageKey,
      viewport_transform: [vt[0], vt[1], vt[2], vt[3], vt[4], vt[5]],
      objects:            serializeLines(),
    };
  }

  function sendToStreamlit() {
    if (!canvas) return;
    Streamlit.setValue(serializeState());
  }

  // ─── ボタンイベント ───────────────────────────────────────
  btnClear.addEventListener("click", () => {
    const lines = getCompletedLines();
    if (lines.length === 0) return;  // 何もなければ Undo 対象にもしない
    captureUndoSnapshot();
    lines.forEach((ln) => canvas.remove(ln));
    canvas.discardActiveObject();
    canvas.requestRenderAll();
    updateLineCount();
    updateDeleteButtonState();
    sendToStreamlit();  // 消去後の空状態を Python へ送信
  });

  btnReset.addEventListener("click", () => {
    resetView();
    sendToStreamlit();  // リセット後の viewport を Python へ送信
  });

  btnDeleteSelected.addEventListener("click", () => {
    const active = canvas.getActiveObject();
    if (!active || mode !== "select") return;

    captureUndoSnapshot();
    if (active.type === "activeSelection" && typeof active.forEachObject === "function") {
      // 通常は単一選択のみの想定だが、念のため複数含まれていても安全に削除する。
      active.forEachObject((obj) => canvas.remove(obj));
    } else {
      canvas.remove(active);
    }
    canvas.discardActiveObject();
    canvas.requestRenderAll();
    updateLineCount();
    updateDeleteButtonState();
    sendToStreamlit();
  });

  // ─── 直線を復元 ──────────────────────────────────────────
  function restoreLines(objects) {
    if (!Array.isArray(objects) || objects.length === 0) return;

    const selectableNow = (mode === "select");

    objects.forEach((item) => {
      if (!item || item.type !== "line") return;
      const x1 = item.orig_x1, y1 = item.orig_y1;
      const x2 = item.orig_x2, y2 = item.orig_y2;
      if (typeof x1 !== "number" || typeof y1 !== "number" ||
          typeof x2 !== "number" || typeof y2 !== "number") return;

      // カテゴリは積算属性。未知の値・null は「未分類」として扱い、色のみ既定色を用いる。
      const category = (typeof item.category === "string" &&
        Object.prototype.hasOwnProperty.call(CATEGORY_COLORS, item.category))
        ? item.category
        : null;

      const sw = 2 / canvas.getZoom();
      const ln = new fabric.Line([x1, y1, x2, y2], {
        stroke:        colorForCategory(category),
        strokeWidth:   sw,
        selectable:    selectableNow,
        evented:       selectableNow,
        hasControls:   false,
        lockMovementX: true,
        lockMovementY: true,
        lockRotation:  true,
        lockScalingX:  true,
        lockScalingY:  true,
        _completed:    true,
        _origX1:       x1,
        _origY1:       y1,
        _origX2:       x2,
        _origY2:       y2,
        _lengthPx:     item.length_px,
        _category:     category,
      });
      canvas.add(ln);
    });

    canvas.requestRenderAll();
    updateLineCount();
  }

  // ─── マウスイベント ───────────────────────────────────────
  function onMouseDown(opt) {
    const e = opt.e;

    if (mode === "select") {
      // 選択モードでは新規描画・パンは行わない。
      // 個別オブジェクトのクリック選択は Fabric.js のデフォルト挙動
      // （各線の selectable/evented）に委ねる。
      return;
    }

    if (mode === "move") {
      isPanning = true;
      panLastX  = e.clientX;
      panLastY  = e.clientY;
      wrapper.classList.add("dragging");
      return;
    }

    // 線モード: 描画開始
    // canvas.getPointer() → ワールド座標（= 元画像ピクセル座標）
    const ptr  = canvas.getPointer(e);
    isDrawing  = true;
    drawStartX = ptr.x;
    drawStartY = ptr.y;

    activePreviewLine = new fabric.Line(
      [drawStartX, drawStartY, drawStartX, drawStartY],
      {
        stroke:      colorForCategory(currentCategory),
        strokeWidth: 2 / canvas.getZoom(),
        selectable:  false,
        evented:     false,
        _completed:  false,
      }
    );
    canvas.add(activePreviewLine);
  }

  function onMouseMove(opt) {
    const e = opt.e;

    if (mode === "move" && isPanning) {
      const dx = e.clientX - panLastX;
      const dy = e.clientY - panLastY;
      panLastX = e.clientX;
      panLastY = e.clientY;
      const vt = canvas.viewportTransform;
      canvas.setViewportTransform([vt[0], vt[1], vt[2], vt[3], vt[4] + dx, vt[5] + dy]);
      canvas.requestRenderAll();
      return;
    }

    if (mode === "line" && isDrawing && activePreviewLine) {
      const ptr = canvas.getPointer(e);
      activePreviewLine.set({
        x2:          ptr.x,
        y2:          ptr.y,
        strokeWidth: 2 / canvas.getZoom(),
      });
      canvas.requestRenderAll();
    }
  }

  function onMouseUp(opt) {
    const e = opt.e;

    if (mode === "move" && isPanning) {
      isPanning = false;
      wrapper.classList.remove("dragging");
      sendToStreamlit();  // パン完了 → Python へ送信
      return;
    }

    if (mode === "line" && isDrawing) {
      isDrawing = false;

      const ptr = canvas.getPointer(e);
      const x1 = drawStartX, y1 = drawStartY;
      const x2 = ptr.x,      y2 = ptr.y;
      const dx = x2 - x1,    dy = y2 - y1;
      const lengthPx = Math.sqrt(dx * dx + dy * dy);

      if (activePreviewLine) {
        canvas.remove(activePreviewLine);
        activePreviewLine = null;
      }

      // 3px 未満はクリック誤操作として破棄
      if (lengthPx < 3) return;

      // 追加前の状態を保存（直近1操作Undo用）
      captureUndoSnapshot();

      // 完了済み線を追加（ワールド座標で保存）
      const sw = 2 / canvas.getZoom();
      const completedLine = new fabric.Line([x1, y1, x2, y2], {
        stroke:        colorForCategory(currentCategory),
        strokeWidth:   sw,
        selectable:    false,
        evented:       false,
        hasControls:   false,
        lockMovementX: true,
        lockMovementY: true,
        lockRotation:  true,
        lockScalingX:  true,
        lockScalingY:  true,
        _completed:    true,
        _origX1:       x1,
        _origY1:       y1,
        _origX2:       x2,
        _origY2:       y2,
        _lengthPx:     lengthPx,
        _category:     currentCategory || null,
      });
      canvas.add(completedLine);
      canvas.requestRenderAll();
      updateLineCount();
      sendToStreamlit();  // 線確定 → Python へ送信
    }
  }

  // ─── ホイールズーム ───────────────────────────────────────
  function onMouseWheel(opt) {
    const e = opt.e;
    e.preventDefault();
    e.stopPropagation();

    let zoom = canvas.getZoom();
    zoom *= 0.999 ** e.deltaY;
    zoom = Math.max(0.05, Math.min(20, zoom));

    canvas.zoomToPoint({ x: e.offsetX, y: e.offsetY }, zoom);
    canvas.requestRenderAll();
    updateZoomLabel();

    // ズーム完了（静止300ms後）に Python へ送信
    clearTimeout(zoomDebounceTimer);
    zoomDebounceTimer = setTimeout(() => { sendToStreamlit(); }, ZOOM_DEBOUNCE_MS);
  }

  // ─── テスト用 API（Playwright から呼び出す）───────────────
  window.__testAPI = {
    /** 現在の状態全体を返す */
    getState: () => (canvas ? serializeState() : null),
    /** 現在のズーム倍率 */
    getZoom:  () => (canvas ? canvas.getZoom() : null),
    /** 初期フィット倍率 */
    getFitZoom: () => fitZoom,
    /**
     * ワールド座標 → フレーム内 CSS 座標（ツールバー分を含む）
     * Playwright の iframe.evaluate() から呼び出す想定
     */
    worldToFrameCoords: (wx, wy) => {
      if (!canvas) return null;
      const vt = canvas.viewportTransform;
      return {
        x: wx * vt[0] + vt[4],
        y: wy * vt[3] + vt[5] + TOOLBAR_H,
      };
    },
    /** 現在のモード ("line" | "move" | "select") */
    getMode: () => mode,
    /** 現在選択中のカテゴリ（次に描画する線へ適用される値） */
    getCurrentCategory: () => currentCategory,
    /** Undo が実行可能か */
    isUndoAvailable: () => undoSnapshot !== null,
    /** 「選択中を削除」ボタンが有効か */
    isDeleteEnabled: () => !btnDeleteSelected.disabled,
  };

  // ─── Streamlit からの props を受信 ───────────────────────
  Streamlit.onRender(function (args) {
    const {
      imageDataUrl,
      imageWidth:   imgW,
      imageHeight:  imgH,
      pageKey,
      canvasState,         // 保存済み状態 dict {page_key, viewport_transform, objects}
      canvasHeight: propsCanvasHeight,
      categories:   propsCategories,   // A3-1: カテゴリ候補（唯一の正本は core.estimate_storage）
    } = args;

    // canvasHeight を props から明示的に設定
    if (propsCanvasHeight && propsCanvasHeight > 0) {
      canvasDisplayHeight = propsCanvasHeight;
    }

    // カテゴリ候補を反映
    populateCategories(propsCategories);

    // キャンバス未初期化なら初期化
    if (!canvas) {
      initCanvas();
    }

    // ページ変更または初回ロード → 背景を再ロード
    if (pageKey !== lastPageKey || imageDataUrl !== lastImageDataUrl) {
      lastPageKey      = pageKey;
      lastImageDataUrl = imageDataUrl;
      currentPageKey   = pageKey;

      // 描画中状態のクリア
      if (activePreviewLine) { activePreviewLine = null; }
      isDrawing = false;

      // Undo スナップショット・選択状態もページ切替でクリア（別ページの状態を誤って復元しない）
      undoSnapshot = null;
      updateUndoButtonState();

      // キャンバスをクリア（背景・直線を含む全オブジェクト）
      canvas.clear();
      bgImage = null;

      // 背景画像を読み込み、コールバック内で状態を復元
      loadBackground(imageDataUrl, imgW, imgH, canvasState || null);
    }
    // 同一ページの rerun → iframe が持続しているのでキャンバス状態はそのまま

    // iframe 高さを明示的に Streamlit へ通知
    Streamlit.setFrameHeight(canvasDisplayHeight + TOOLBAR_H);
  });

})();
</script>
</body>
</html>
